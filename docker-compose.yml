# ============================================================
# Email Center
#
# 统一使用服务器现有基础设施：
#
# PostgreSQL:
#   postgres.db.pixris.com:5432
#
# Redis:
#   redis.db.pixris.com:6379
#
# 宝塔通过 web Docker 网络反代：
#
# Web:
#   emailcenter.web.pixris.com:80
#
# API:
#   emailcenter-api.web.pixris.com:4121
# ============================================================


# API / Worker / Migrate 共用构建配置
x-api-build: &api-build
  context: .
  dockerfile: docker/api.Dockerfile


# API / Worker / Migrate 共用运行配置
x-api-env: &api-env
  APP_ENV: production

  APP_HOST: 0.0.0.0
  APP_PORT: 4121

  APP_ATTACHMENT_DIR: /app/storage/attachments

  # 使用服务器现有 PostgreSQL
  DB_HOST: postgres.db.pixris.com
  DB_PORT: 5432

  # 使用服务器现有 Redis
  REDIS_HOST: redis.db.pixris.com
  REDIS_PORT: 6379


services:

  # ==========================================================
  # 数据库迁移
  # ==========================================================
  migrate:
    build: *api-build

    image: emailcenter-api:latest
    container_name: emailcenter-migrate

    restart: "no"

    env_file:
      - .env

    environment:
      <<: *api-env

    command:
      - node
      - scripts/migrate.js

    # 迁移只需要访问数据库网络
    networks:
      - database


  # ==========================================================
  # API
  # ==========================================================
  api:
    build: *api-build

    image: emailcenter-api:latest
    container_name: emailcenter-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      <<: *api-env

    # 不再映射宿主机端口
    # 通过 web Docker 网络让宝塔直接访问
    expose:
      - "4121"

    volumes:
      - attachment_data:/app/storage

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:4121/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:

      # 宝塔反向代理网络
      web:
        aliases:
          - emailcenter-api.web.pixris.com

      # PostgreSQL / Redis 网络
      database:


  # ==========================================================
  # Worker
  # ==========================================================
  worker:
    build: *api-build

    image: emailcenter-api:latest
    container_name: emailcenter-worker

    restart: unless-stopped

    env_file:
      - .env

    environment:
      <<: *api-env

    command:
      - node
      - src/workers/email-worker.js

    volumes:
      - attachment_data:/app/storage

    depends_on:
      migrate:
        condition: service_completed_successfully

    # Worker 不对外提供 HTTP
    # 所以只加入数据库网络即可
    networks:
      - database


  # ==========================================================
  # Web
  # ==========================================================
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile

    image: emailcenter-web:latest
    container_name: emailcenter-web

    restart: unless-stopped

    # 不再映射宿主机 3121
    # 宝塔直接走 Docker web 网络
    expose:
      - "80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      web:
        aliases:
          - emailcenter.web.pixris.com


# ============================================================
# 持久化
# ============================================================

volumes:
  attachment_data:


# ============================================================
# 使用服务器已经创建好的公共网络
# ============================================================

networks:

  web:
    external: true
    name: web

  database:
    external: true
    name: database