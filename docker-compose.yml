# ============================================================
# Email Center
#
# 复用服务器现有：
# PostgreSQL 18 → postgres.db.pixris.com:5432
# Redis         → redis.db.pixris.com:6379
#
# 宝塔通过 web 网络访问：
# Web → emailcenter.web.pixris.com:80
# API → emailcenter-api.web.pixris.com:4121
# ============================================================

x-api-build: &api-build
  context: .
  dockerfile: docker/api.Dockerfile

x-api-env: &api-env
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: 4121

  APP_ATTACHMENT_DIR: /app/storage/attachments

  DB_HOST: postgres.db.pixris.com
  DB_PORT: 5432

  REDIS_HOST: redis.db.pixris.com
  REDIS_PORT: 6379


services:

  # ==========================================================
  # 数据库迁移
  # ==========================================================
  migrate:
    build: *api-build
    image: emailcenter-api:latest
    container_name: emailcenter-migrate
    restart: "no"

    env_file:
      - .env

    environment:
      <<: *api-env

    command:
      - node
      - scripts/migrate.js

    networks:
      - database


  # ==========================================================
  # API
  # ==========================================================
  api:
    build: *api-build
    image: emailcenter-api:latest
    container_name: emailcenter-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      <<: *api-env

    expose:
      - "4121"

    volumes:
      - attachment_data:/app/storage

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:4121/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      web:
        aliases:
          - emailcenter-api.web.pixris.com

      database:


  # ==========================================================
  # Worker
  # ==========================================================
  worker:
    build: *api-build
    image: emailcenter-api:latest
    container_name: emailcenter-worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      <<: *api-env

    command:
      - node
      - src/workers/email-worker.js

    volumes:
      - attachment_data:/app/storage

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - database


  # ==========================================================
  # Web
  # ==========================================================
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile

    image: emailcenter-web:latest
    container_name: emailcenter-web
    restart: unless-stopped

    expose:
      - "80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      api:
        condition: service_started

    networks:
      web:
        aliases:
          - emailcenter.web.pixris.com


volumes:
  attachment_data:


networks:

  web:
    external: true
    name: web

  database:
    external: true
    name: database